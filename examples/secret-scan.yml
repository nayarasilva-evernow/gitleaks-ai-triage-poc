# Copie este arquivo para .github/workflows/secret-scan.yml no repositório real
# e cadastre o secret GROQ_API_KEY em Settings > Secrets and variables > Actions.

name: Secret scan + AI triage

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # necessário para a action comparar base..head do PR
          fetch-depth: 0

      - name: Secret scan + triagem IA
        id: triage
        uses: nayarasilva-evernow/gitleaks-ai-triage-poc@reusable-action
        with:
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          scan-scope: diff
          fail-on: true_positive

      # O relatório não contém secrets (só arquivo, regra, veredicto e motivo).
      # findings.json contém os valores em claro — não suba esse arquivo.
      - name: Upload do relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-triage
          path: |
            triage-report.json
            suggested_rules.toml
          if-no-files-found: ignore
