# Gitleaks config — POC de triagem com IA
# Docs: https://github.com/gitleaks/gitleaks

title = "gitleaks-ai-triage-poc"

[extend]
# Usa as regras default do Gitleaks e adiciona o allowlist abaixo
useDefault = true

# ---------------------------------------------------------------------------
# O allowlist global do Gitleaks é UMA tabela ([allowlist]), não um array:
# `[[allowlists]]` no nível global é silenciosamente ignorado.
# Os critérios abaixo combinam por OR — cada um vale de forma independente.
# ---------------------------------------------------------------------------
[allowlist]

# Só conteúdo gerado ou dependência de terceiros, onde não há o que revisar.
#
# Placeholders (changeme, fake_token) NÃO entram aqui de propósito: suprimir no
# scan os torna invisíveis no relatório. Quem classifica esses valores é a
# heurística local (triage/heuristics.py) — de graça, sem chamar a IA, e com o
# veredicto visível para quem abriu o PR.
paths = [
  '''gitleaks\.toml''',
  '''(^|/)(node_modules|vendor|dist|build|\.venv)/.*''',
  '''(^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|poetry\.lock|Gemfile\.lock|go\.sum)$''',
]
