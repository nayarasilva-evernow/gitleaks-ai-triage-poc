# Gitleaks config — POC de triagem com IA
# Docs: https://github.com/gitleaks/gitleaks

title = "gitleaks-ai-triage-poc"

[extend]
# Usa as regras default do Gitleaks e adiciona o allowlist abaixo
useDefault = true

# ---------------------------------------------------------------------------
# O allowlist global do Gitleaks é UMA tabela ([allowlist]), não um array:
# `[[allowlists]]` no nível global é silenciosamente ignorado.
# Os critérios abaixo combinam por OR — cada um vale de forma independente.
# ---------------------------------------------------------------------------
[allowlist]

# Supressão por caminho só para conteúdo gerado ou dependência de terceiros.
# Arquivo escrito por pessoa (teste, doc, exemplo) não entra aqui: suprimir o
# caminho esconderia um segredo novo inserido nele depois.
paths = [
  '''gitleaks\.toml''',
  '''(^|/)(node_modules|vendor|dist|build|\.venv)/.*''',
  '''(^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|poetry\.lock|Gemfile\.lock|go\.sum)$''',
]

# regexes e stopwords são avaliados contra o valor extraído, então um segredo
# real em arquivo de teste continua sendo detectado.
regexes = [
  '''(?i)(changeme|replace[_-]?me|your[_-]?api[_-]?key|not[_-]?a[_-]?secret|placeholder|dummy|redacted)''',
  '''(?i)xxx+''',
]

# Valores explicitamente inválidos, conforme a política para segredos de teste.
stopwords = [
  "fake_token",
  "fake_secret",
  "fake_key",
  "fake_password",
  "invalid_token",
  "invalid_key",
  "example",
]
